name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Vet
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Formatting check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Acceptance suite
        run: python3 tests/acceptance.py

      - name: Smoke test (help output)
        run: go run ./cmd/vexor -banner

  fresh-install:
    name: Clean-environment install (fresh user simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Simulates a brand-new user: synthetic HOME, minimal PATH without any
      # Go/VEXOR state, empty shell profile. Verifies installer + PATH fix +
      # binary working from a foreign cwd.
      - name: Run clean-environment install test
        run: python3 tests/install_clean_env.py
