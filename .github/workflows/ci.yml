name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Vet
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Formatting check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Smoke test (help output)
        run: go run ./cmd/vexor -banner
