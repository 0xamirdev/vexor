name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w" -o "vexor-${GOOS}-${GOARCH}" ./cmd/vexor
          test -x "vexor-${GOOS}-${GOARCH}"

      - name: Smoke test (native platform only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./vexor-linux-amd64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vexor-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vexor-*
          fail_on_unmatched_files: true
